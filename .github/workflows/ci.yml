name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q reproduce.py scripts src
          bash -n scripts/run_alfworld_k4_repro.sh
      - name: Run synthetic smoke test
        run: python reproduce.py smoke
      - name: Validate paper-matrix commands
        run: python reproduce.py matrix --scope all --dry-run
